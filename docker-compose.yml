
services:
  web:
    build: .
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped

  lb:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
